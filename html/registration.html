<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div class="page"><h2>Registration</h2>
<form class="box" id="regForm">
<label>Full name</label><input name="fullname" required>
<label>Email</label><input type="email" name="email" required>
<label>Phone</label><input name="phone" inputmode="numeric" maxlength="10" required>
<label>Gender</label><select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
<label>Date of birth</label><input type="date" name="dob" required>
<label>Username</label><input name="username" required>
<label>Password</label><input type="password" name="password" required>
<label>Confirm password</label><input type="password" name="confirm" required>
<div class="error" id="regErr"></div><div class="success" id="regOk"></div>
<button type="submit">Register</button></form></div>
<script src="../js/main.js"></script>
</body></html>
